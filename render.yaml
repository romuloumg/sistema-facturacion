services:
  - type: web
    name: sistema-facturacion-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # startCommand: "gunicorn app:app --preload --workers=2 --threads=4 --timeout=120"
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
