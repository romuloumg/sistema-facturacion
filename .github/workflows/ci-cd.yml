name: CI/CD - Sistema de Facturación (Reforzado)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: ✅ Verificar entorno de Python
        run: |
          python --version
          pip list

      - name: 🧹 Linter de código Python (flake8)
        run: |
          echo "Ejecutando análisis de calidad con flake8..."
          flake8 app --max-line-length=100 --ignore=E402,W503

      - name: 🧪 Pruebas unitarias (placeholder)
        run: |
          echo "Ejecutando pruebas unitarias..."
          # pytest tests/  # (descomentar cuando agregues tests)

  frontend-check:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v3

      - name: 🛠️ Verificar archivos frontend
        run: |
          echo "Revisando estructura del frontend..."
          ls -R frontend/

      - name: 🌐 Configurar Node.js para análisis JS
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Instalar ESLint
        run: |
          npm install eslint -g
          echo "Instalando ESLint globalmente para revisión JS..."

      - name: 🧠 Linter de código JS
        run: |
          echo "Analizando calidad de JS..."
          eslint frontend/assets/js || true

  deploy-ready:
    runs-on: ubuntu-latest
    needs: [build, frontend-check]

    steps:
      - name: 🚀 Simulación de despliegue
        run: |
          echo "Pipeline completo: Build + Tests + Lint OK ✅"
          echo "Listo para pasar a Fase 4 (CD - Despliegue)."
