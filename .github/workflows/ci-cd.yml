name: CI/CD - Sistema de Facturación

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧰 Checkout del repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'   # Cambia si usas otra versión

    - name: 📦 Instalar dependencias de backend (Python)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪 Ejecutar pruebas básicas
      run: |
        echo "✅ Backend instalado correctamente"
        python --version

    - name: 🌐 Instalar dependencias de frontend (opcional)
      run: |
        echo "📌 No hay build automatizado para el frontend aún, pero se podría agregar aquí"
